[project]
name = "elibrarian"
version = "1.0.0"
description = "A helper service that monitors ebook directories and organises books using metadata"
authors = [
    { name = "Tom Freeman", email = "tomrfreeman3@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ebooklib==0.20",
    "httpx==0.28.1",
    "isbnlib==3.10.14",
    "watchdog==6.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
]

[project.scripts]
elibrarian = "elibrarian.main:main"

[build-system]
requires = ["poetry-core==2.0.0"]
build-backend = "poetry.core.masonry.api"
